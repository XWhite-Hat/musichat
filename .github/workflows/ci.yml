###############################################################################
# CI — Runs on every push and pull request.
#
# SECURITY MODEL
# ──────────────
# • All third-party actions are pinned to immutable commit SHAs.
#   Tags are mutable (CVE-2025-30066 / TeamPCP vector) — SHAs are not.
#
# • To verify a SHA:
#     gh api repos/<owner>/<repo>/git/refs/tags/<tag> --jq '.object.sha'
#   or browse https://github.com/<owner>/<repo>/commit/<sha>
#
# • `pull_request_target` is intentionally ABSENT — it runs with write
#   permissions and access to secrets, making it the primary OIDC-theft
#   vector used by shai-hulud / TeamPCP.
#
# • Default GITHUB_TOKEN is read-only.  Individual jobs request only what
#   they need via the `permissions:` key.
#
# SHA MAINTENANCE
# ───────────────
# Dependabot keeps these pinned SHAs current (see dependabot.yml).
# After Dependabot bumps a SHA, verify the new commit before merging.
###############################################################################

name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, develop]
    # NOTE: pull_request (not pull_request_target) — forks run with
    # read-only token and no access to repository secrets.

# Minimum permissions at the workflow level — jobs opt-in to more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Scan the workflows themselves for security issues (zizmor)
  # ────────────────────────────────────────────────────────────────────────────
  workflow-security:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Uncomment once Code Scanning Default Setup is enabled in repo settings:
      # security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pip install zizmor==1.5.0 --no-deps --quiet

      - name: Run zizmor
        run: |
          zizmor --format sarif . > zizmor.sarif 2>/dev/null || true
          zizmor --format plain .
      # Once Code Scanning Default Setup is enabled, uncomment this block to get
      # zizmor findings in the Security tab alongside CodeQL:
      #
      # - name: Upload SARIF to Code Scanning
      #   uses: github/codeql-action/upload-sarif@<SHA>  # pin before enabling
      #   if: always()
      #   with:
      #     sarif_file: zizmor.sarif
      #     category: zizmor

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Audit Python dependencies for known CVEs
  # ────────────────────────────────────────────────────────────────────────────
  pip-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266  # v1.1.0
        with:
          inputs: requirements.txt
          # Fail on any vulnerability with a fix available.
          # Unfixable vulns are flagged but don't block CI (they get a
          # separate SARIF upload for triage).
          vulnerability-service: osv
          summary: true

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Dependency review — catch new vulnerable/license-violating deps on PRs
  # ────────────────────────────────────────────────────────────────────────────
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    # Only runs on PRs — push events don't have a base to diff against.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, LGPL-2.0, LGPL-2.1, AGPL-3.0
          comment-summary-in-pr: always

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Static lint (ruff — rules configured in ruff.toml)
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
          cache: pip

      # Install from requirements-dev.txt rather than repeating a version
      # here.  The two had already drifted apart once — CI was linting with
      # ruff 0.8.6 while developers had 0.16.5, which flags a different rule
      # set entirely, so "passes locally" and "passes CI" meant different
      # things.  One pin, one source of truth.
      - name: Install ruff
        run: pip install -r requirements-dev.txt --quiet

      - name: Lint
        run: ruff check . --output-format=github

  # ────────────────────────────────────────────────────────────────────────────
  # 5. Verify TWITCH_APP_CLIENT_ID is NOT committed (repo safety check)
  # ────────────────────────────────────────────────────────────────────────────
  client-id-leak-check:
    name: Client ID leak check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Confirm no client ID committed to source
        run: |
          # TWITCH_CLIENT_ID must never be committed — BYOI users use .env,
          # proxied mode uses the Cloudflare Worker.
          if grep -n 'TWITCH_APP_CLIENT_ID.*=.*"[a-z0-9]\{8,\}"' constants.py; then
            echo "::error file=constants.py::A Twitch client ID is committed in constants.py!"
            echo "::error::Remove it immediately. Use a .env file for BYOI development."
            exit 1
          fi
          echo "OK: No client ID in source."

      - name: Secret pattern scan (trufflehog)
        # Skip on the very first push to a new repo (before SHA is all-zeros).
        if: >-
          github.event_name == 'pull_request' ||
          (github.event_name == 'push' &&
           github.event.before != '0000000000000000000000000000000000000000')
        uses: trufflesecurity/trufflehog@363923b901c911a9164f50b6c423f47c15372b1c  # v3.97.4
        with:
          path: ./
          base: >-
            ${{ github.event_name == 'pull_request'
              && github.event.pull_request.base.sha
              || github.event.before }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: true   # advisory — trufflehog cloud is unreliable in CI

  # ────────────────────────────────────────────────────────────────────────────
  # 6. Unit tests
  # ────────────────────────────────────────────────────────────────────────────
  tests:
    name: Unit tests
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
          cache: pip

      # Install from the hash-pinned lockfile, exactly as the release build
      # does, so the tests exercise the same dependency versions that ship
      # rather than whatever happens to be latest on PyPI that day.
      #
      # The suite covers pure logic only (queue caps, config persistence,
      # version comparison, logging), so it needs no display, no audio device
      # and never imports PySide6.
      - name: Install dependencies (hash-pinned, as release does)
        run: pip install --require-hashes --no-deps -r requirements-build.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q

  # ────────────────────────────────────────────────────────────────────────────
  # 7. Build smoke test — the check that would have caught the last three
  #    release regressions (a missing runtime dependency, an unbundled DLL,
  #    and a crash handler that never ran).  None of the static checks above
  #    can catch those, because none of them build or start the app.
  # ────────────────────────────────────────────────────────────────────────────
  build-smoke-test:
    name: Build smoke test
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"

      # Installs exactly what the release workflow installs, so a dependency
      # that is missing from the lockfile fails here rather than in a release.
      - name: Install dependencies (hash-pinned, as release does)
        run: pip install --require-hashes --no-deps -r requirements-build.txt

      - name: Install PyInstaller (hash-pinned)
        run: |
          pip install altgraph pyinstaller-hooks-contrib pefile pywin32-ctypes
          pip install --require-hashes --no-deps -r build/pyinstaller-req.txt

      - name: Install LGPL av wheel
        run: pip install --force-reinstall --no-deps vendor/av-17.1.0-cp314-cp314-win_amd64.whl

      - name: Build binary
        run: pyinstaller build/musicplayer.spec --noconfirm --clean --distpath dist

      # PySide6 is downloaded at first run, not bundled, so a full launch would
      # need a ~150 MB download and a display.  Instead drive the binary's own
      # hidden smoke-test mode, which resolves the bootstrap, loads every
      # native DLL and imports PySide6 — the exact path that broke in v1.0.1/2.
      - name: Verify the binary starts and can load PySide6
        shell: pwsh
        run: |
          $dataDir = Join-Path $env:RUNNER_TEMP "musichat-smoke"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null

          python -c "import sys; sys.path.insert(0,'.'); from pathlib import Path; from pyside_downloader import download_pyside6; ok,msg = download_pyside6(Path(r'$dataDir') / 'pyside6'); print('download:', ok, msg); sys.exit(0 if ok else 1)"

          $p = Start-Process -FilePath "dist\musichat.exe" `
                             -ArgumentList "--pyside6-smoke-test", $dataDir `
                             -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::The built binary could not load PySide6 (exit $($p.ExitCode))."
            Write-Host "::error::This is the failure mode that shipped in v1.0.1 and v1.0.2."
            exit 1
          }
          Write-Host "Binary started and loaded PySide6 successfully."

  # ────────────────────────────────────────────────────────────────────────────
  # 8. Lockfile drift — requirements-build.txt is what CI actually installs,
  #    and it only changes when someone remembers to regenerate it.  That is
  #    how yt-dlp stayed pinned two and a half months behind its own allowed
  #    range while YouTube extraction quietly rotted.
  # ────────────────────────────────────────────────────────────────────────────
  lockfile-drift:
    # Windows, not ubuntu: requirements-build.txt is resolved for Windows (it
    # contains pywin32-ctypes and omits the Linux-only keyring backends, and
    # carries no environment markers).  Regenerating it on Linux produces a
    # legitimately different file, so this check would fail on every run.
    name: Lockfile up to date
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install pip-tools
        run: pip install pip-tools --quiet

      - name: Check requirements-build.txt matches requirements.txt
        shell: bash
        run: |
          cp requirements-build.txt requirements-build.committed
          pip-compile requirements.txt --generate-hashes --resolver=backtracking             --no-header --output-file requirements-build.txt --allow-unsafe --quiet
          # Ignore pure line-ending differences: the committed file is written
          # on Windows, and git may check it out with either convention.
          if ! diff -q --strip-trailing-cr requirements-build.committed requirements-build.txt > /dev/null; then
            echo "::error::requirements-build.txt is out of date with requirements.txt."
            echo "::error::Run scripts/generate-lockfile.ps1 and commit the result."
            diff --strip-trailing-cr requirements-build.committed requirements-build.txt || true
            exit 1
          fi
          echo "OK: lockfile is up to date."
