version: 2

updates:
  # Python dependencies — weekly, patch/minor grouped, major separate.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        update-types: [patch]
      minor-updates:
        update-types: [minor]
    commit-message:
      prefix: "deps(pip)"
    ignore:
      # twitchio major versions have broken APIs — update manually.
      - dependency-name: twitchio
        update-types: ["version-update:semver-major"]
      # pydantic-core is an internal implementation detail of pydantic.
      # Its version is dictated by pydantic itself — updating it independently
      # breaks the app.  Let pydantic own this; regenerate the lockfile when
      # pydantic bumps.
      - dependency-name: pydantic-core
      # av must match vendor/av-<version>-cp314-cp314-win_amd64.whl exactly.
      # The binary ships that vendored LGPL build, not the PyPI wheel (which
      # bundles GPL x264/x265), so bumping this line alone makes the lockfile
      # and SBOM describe a version that is not the one shipped.  Moving it
      # requires rebuilding the wheel via scripts/build-lgpl-av.ps1 and
      # updating the filename in the workflows — a deliberate manual step.
      - dependency-name: av

  # GitHub Actions — weekly, SHA-pinned SHAs kept current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
